<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>405 - Method Not Allowed</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0f2027,#2c5364);
    color:white;
}

.container{
    text-align:center;
    padding:40px;
}

h1{
    font-size:120px;
    margin:0;
}

h2{
    font-weight:300;
    margin-bottom:20px;
}

p{
    opacity:0.9;
}

.method{
    margin-top:20px;
    padding:10px 20px;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:20px;
    display:inline-block;
    font-size:14px;
}

a{
    display:inline-block;
    margin-top:25px;
    padding:12px 25px;
    background:white;
    color:#2c5364;
    text-decoration:none;
    border-radius:25px;
    font-weight:bold;
}

a:hover{
    background:#e6e6e6;
}
</style>

</head>

<body>

<div class="container">
<h1>405</h1>
<h2>Method Not Allowed</h2>

<p>
The HTTP method used in your request is not allowed for this resource.
</p>

<div class="method">
Allowed methods may include: GET, POST
</div>

<br>

<a href="/">Return Home</a>

</div>

</body>
</html>
