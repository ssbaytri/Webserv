<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload | Webserv</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #111827;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --error: #ef4444;
            --success: #10b981;
            --text: #e5e7eb;
            --muted: #9ca3af;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a, #1e1b4b);
            background-size: 200% 200%;
            animation: gradientBG 15s ease infinite;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
        }

        .card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.05);
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #fff;
        }

        h2 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        p.subtitle {
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .upload-area {
            border: 2px dashed rgba(56, 189, 248, 0.4);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            background: rgba(2, 6, 23, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            margin-bottom: 20px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
            box-shadow: 0 0 20px var(--accent-glow) inset;
        }

        .upload-area.dragover {
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .upload-text {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: var(--muted);
            font-size: 0.85rem;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            display: none;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-info.show {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-name {
            color: #fff;
            font-weight: 500;
            font-size: 0.95rem;
            word-break: break-all;
            margin-right: 15px;
        }

        .file-size {
            color: var(--accent);
            font-size: 0.85rem;
            font-family: monospace;
            white-space: nowrap;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn-upload {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn-upload:hover:not(:disabled) {
            background: var(--accent);
            color: #0f172a;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .btn-upload:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-clear:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-clear:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .response {
            display: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            text-align: left;
            animation: fadeIn 0.3s ease;
        }

        .response.show {
            display: block;
        }

        .response.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .response.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>File <span>Upload</span></h2>
            <p class="subtitle">Securely transfer files to the server</p>

            <form id="uploadForm" action="/uploads" method="POST" enctype="multipart/form-data">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">☁️</div>
                    <div class="upload-text">Click to browse or drag & drop</div>
                    <div class="upload-hint">Maximum file size: 10MB</div>
                    <input type="file" id="fileInput" name="file" accept="*/*">
                </div>

                <div class="file-info" id="fileInfo">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>

                <div class="btn-container">
                    <button type="button" class="btn-clear" id="clearBtn" disabled>Clear</button>
                    <button type="submit" class="btn-upload" id="uploadBtn" disabled>Upload File</button>
                </div>
            </form>

            <div class="response" id="response"></div>

            <a href="/" class="back-link">← Return to Home</a>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const uploadForm = document.getElementById('uploadForm');
        const response = document.getElementById('response');

        // Click to browse
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // File selected
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Drag & drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files; // update actual input
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                fileName.textContent = file.name;
                fileSize.textContent = formatFileSize(file.size);
                fileInfo.classList.add('show');
                uploadBtn.disabled = false;
                clearBtn.disabled = false;
                response.classList.remove('show');
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        clearBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInfo.classList.remove('show');
            uploadBtn.disabled = true;
            clearBtn.disabled = true;
            response.classList.remove('show');
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(uploadForm);
            uploadBtn.disabled = true;
            clearBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';
            response.classList.remove('show');

            try {
                const res = await fetch('/uploads', {
                    method: 'POST',
                    body: formData
                });

                const text = await res.text();
                
                if (res.ok) {
                    response.className = 'response success show';
                    response.textContent = '✓ ' + text;
                } else {
                    response.className = 'response error show';
                    response.textContent = '✗ Upload failed: ' + text;
                }
            } catch (error) {
                response.className = 'response error show';
                response.textContent = '✗ Upload failed: ' + error.message;
            } finally {
                uploadBtn.disabled = false;
                clearBtn.disabled = false;
                uploadBtn.textContent = 'Upload File';
            }
        });
    </script>
</body>
</html>
